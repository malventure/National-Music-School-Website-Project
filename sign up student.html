<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The National Music School</title>
    <link rel="icon" type="image/png" href="media/logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img src="media/logo.png" alt="Logo of the National Music School" class="logo" height="100" width="100">
        <h1>The National Music School</h1>
    </header>
    <section id="sign-up">
        <h2>Sign Up</h2>
        <p>Join our music school and start your musical journey today! Fill out the form below to sign up for lessons or to become an instructor.</p>
        <form action="submit_form.php" method="post">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required><br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Create a Password:</label>
            <input type="password" id="password" name="password" required><br><br>

            <label for="role">I am a:</label>
            <radio id="role" name="role" required>
                <input type="radio" value="beginner" name="role" required>Beginner
                <input type="radio" value="intermediate" name="role" required>Intermediate
                <input type="radio" value="professional" name="role" required>Professional
            </radio><br><br>

            <label for="instrument">Instrument of Interest:</label>
            <select id="instrument" name="instrument" required>
                <optgroup label="String Instruments">
                    <option value="guitar">Guitar</option>
                    <option value="violin">Violin</option>
                    <option value="cello">Cello</option>
                    <option value="ukulele">Ukulele</option>
                    <option value="harp">Harp</option>
                </optgroup>
                <optgroup label="Keyboard Instruments">
                    <option value="piano">Piano</option>
                    <option value="synthesizer">Synthesizer</option>
                </optgroup>
                <optgroup label="Wind Instruments">
                    <option value="flute">Flute</option>
                    <option value="saxophone">Saxophone</option>
                    <option value="trumpet">Trumpet</option>
                    <option value="clarinet">Clarinet</option>
                    <option value="harmonica">Harmonica</option>
                </optgroup>
                <optgroup label="Percussion Instruments">
                    <option value="drums">Drums</option>
                </optgroup>
                <optgroup label="Voice">
                    <option value="singing">Singing</option>
                </optgroup>
            </select><br><br> 

            <label for="genre">Genre of Interest:</label>
            <select id="genre" name="genre" required>
                <option value="" disabled selected>Select a genre...</option>
                
                <optgroup label="Classical & Traditional">
                    <option value="classical-orchestral">Classical & Orchestral</option>
                    <option value="folk-acoustic">Folk & Acoustic</option>
                </optgroup>
                
                <optgroup label="Popular & Modern">
                    <option value="rock-pop-indie">Rock, Pop & Indie</option>
                    <option value="contemporary-rnb">Contemporary & R&B</option>
                </optgroup>
                
                <optgroup label="Roots & Rhythm">
                    <option value="jazz-blues">Jazz & Blues</option>
                    <option value="funk-soul">Funk, Soul</option>
                </optgroup>

                <optgroup label="Other">
                    <option value="other">Other</option>
                </optgroup>
            </select><br><br>

            <input type="submit" value="Sign Up">
            <input type="reset" value="Reset">
        </form>
    </section>

    <footer id="contact">
        <p>Contact us by calling: +20 1 234 567 890</p>
        <p>or by sending us an email:</p>
        <form class="email-form" action="mailto:nationalmusicschool@edu.com" method="post">
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>
            
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>
            
            <div class="form-buttons">
                <input type="submit" value="Send">
                <input type="reset" value="Reset">
            </div>
        </form>
    </footer>
</body>
</html>
